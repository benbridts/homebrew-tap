name: Bump casks

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Tap this repository
        run: |
          brew tap "${GITHUB_REPOSITORY/homebrew-/}"
          echo "TAP_DIR=$(brew --repository "${GITHUB_REPOSITORY/homebrew-/}")" >> "$GITHUB_ENV"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump outdated casks that define livecheck
        run: |
          tap="${GITHUB_REPOSITORY/homebrew-/}"
          for file in "$TAP_DIR"/Casks/*.rb; do
            grep -q '^  livecheck do' "$file" || continue
            cask="$(basename "$file" .rb)"
            version="$(brew livecheck --cask --newer-only --json "$tap/$cask" | jq -r '.[0].version.latest // empty')"
            [ -n "$version" ] || continue
            echo "Bumping $cask to $version"
            brew bump-cask-pr --no-browse --no-fork --version "$version" "$tap/$cask"
          done
